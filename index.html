<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff6f0">
<title>Khôi's Little Links ♡</title>
<style>
:root{
 --paper:#fffaf5;--ink:#55464d;--pink:#ffb7c9;--pink2:#ffe0e8;
 --lav:#dcd4ff;--mint:#d5f4e5;--yellow:#fff0b8;--line:#6d5962;
 --white:#fffefa;--shadow:#e8cbd2;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Trebuchet MS",ui-rounded,system-ui,sans-serif;
 background-color:var(--paper);
 background-image:radial-gradient(#f3cbd5 1px,transparent 1px),radial-gradient(#e2dcff 1px,transparent 1px);
 background-size:24px 24px,31px 31px;background-position:0 0,12px 14px}
.wrap{max-width:720px;margin:auto;padding:24px 16px 42px}
.paper{background:rgba(255,250,245,.94);border:2px solid var(--line);border-radius:30px;box-shadow:7px 7px 0 var(--shadow);overflow:hidden}
.top{padding:25px 20px 22px;text-align:center;position:relative;background:linear-gradient(135deg,#ffe4ec,#f1eaff 65%,#e5f8ed);border-bottom:2px dashed #c9a9b5}
.sticker{position:absolute;font-size:28px;filter:drop-shadow(1px 2px 0 #fff);transform:rotate(-12deg)}
.sticker.a{top:15px;left:18px}.sticker.b{right:18px;top:23px;transform:rotate(12deg)}
.chibi{width:126px;height:126px;display:block;margin:4px auto 10px;filter:drop-shadow(3px 4px 0 #e5c4d1)}
.title{font-size:clamp(1.9rem,7vw,2.8rem);line-height:1.08;margin:6px 0 8px;font-weight:1000;letter-spacing:-.04em;color:#765469;text-shadow:2px 2px 0 white}
.title span{color:#e87f9e}
.subtitle{max-width:440px;margin:0 auto;color:#786570;font-size:.96rem;line-height:1.6}
.pills{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:15px}
.pill{border:1.5px solid #9c8490;border-radius:999px;padding:6px 11px;background:#fffdfb;font-size:.78rem;box-shadow:2px 2px 0 #e5cad5}
.content{padding:20px 16px 24px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 13px}
.head h2{font-size:1.08rem;margin:0;color:#765469}.head small{color:#a18491;font-size:.75rem}
.links{display:grid;gap:11px}
.link{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--white);border:2px solid var(--line);border-radius:18px;padding:12px 13px;box-shadow:3px 3px 0 var(--shadow);transition:transform .16s,box-shadow .16s}
.link:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.icon{width:43px;height:43px;border:1.5px solid #927b87;border-radius:14px;display:grid;place-items:center;flex-shrink:0;font-size:1.3rem;background:var(--pink2)}
.link:nth-child(3n+2) .icon{background:var(--lav)}.link:nth-child(3n) .icon{background:var(--mint)}.link:nth-child(4n) .icon{background:var(--yellow)}
.txt{flex:1;min-width:0}.txt strong{display:block;font-size:.97rem}.txt small{display:block;color:#9a8490;margin-top:3px;overflow-wrap:anywhere;font-size:.8rem}
.go{font-size:1.45rem;color:#d57f9b}
.note{text-align:center;color:#9a8490;font-size:.8rem;margin:17px 0 0}
.footer{text-align:center;padding:16px 10px 20px;background:#fff0f4;border-top:2px dashed #c9a9b5;font-size:.83rem;color:#967786}
.footer strong{color:#765469}.heart{color:#e87f9e}
@media(min-width:570px){.wrap{padding-top:34px}.top{padding:30px}.content{padding:24px}.links{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){.link{transition:none}}
</style>
</head>
<body>
<main class="wrap">
<div class="paper">
<header class="top">
 <span class="sticker a">✦</span><span class="sticker b">♡</span>
 <!-- Chibi doodle drawn with inline SVG, so it works offline too -->
 <svg class="chibi" viewBox="0 0 140 140" role="img" aria-label="Hình chibi dễ thương">
  <path d="M24 60 Q12 22 49 18 Q79 0 105 25 Q132 36 116 72 L105 91 L33 91Z" fill="#65536b" stroke="#55464d" stroke-width="3" stroke-linejoin="round"/>
  <path d="M33 53 Q30 25 60 23 Q93 14 111 43 L103 70 Q95 51 82 46 Q60 60 33 53Z" fill="#4d4057" stroke="#55464d" stroke-width="2.5"/>
  <ellipse cx="70" cy="68" rx="42" ry="43" fill="#ffe0cc" stroke="#55464d" stroke-width="3"/>
  <path d="M29 59 Q36 27 63 29 Q84 19 109 43 L105 57 Q89 42 78 43 Q57 59 29 59Z" fill="#65536b" stroke="#55464d" stroke-width="3"/>
  <ellipse cx="54" cy="68" rx="6" ry="9" fill="#55464d"/><ellipse cx="86" cy="68" rx="6" ry="9" fill="#55464d"/>
  <circle cx="56" cy="65" r="2.5" fill="white"/><circle cx="88" cy="65" r="2.5" fill="white"/>
  <ellipse cx="41" cy="80" rx="7" ry="4" fill="#f6a4b6" opacity=".8"/><ellipse cx="99" cy="80" rx="7" ry="4" fill="#f6a4b6" opacity=".8"/>
  <path d="M64 84 Q70 91 77 84" fill="none" stroke="#a85f78" stroke-width="3" stroke-linecap="round"/>
  <path d="M37 103 Q70 89 103 103 L116 133 L24 133Z" fill="#ffb7c9" stroke="#55464d" stroke-width="3" stroke-linejoin="round"/>
  <path d="M54 104 L70 117 L86 104" fill="#fffaf5" stroke="#55464d" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M70 121 C56 111 53 102 61 101 C66 100 70 105 70 105 C74 100 84 101 84 108 C84 114 70 121 70 121Z" fill="#e87f9e" stroke="#55464d" stroke-width="2"/>
  <path d="M18 37 l4 -8 l4 8 l8 4 l-8 4 l-4 8 l-4 -8 l-8 -4Z" fill="#fff0b8" stroke="#55464d" stroke-width="1.5"/>
  <path d="M113 91 q10 -10 17 0 q-6 11 -17 0Z" fill="#d5f4e5" stroke="#55464d" stroke-width="2"/>
 </svg>
 <div class="title">Khôi's <span>Little Links</span> ♡</div>
 <p class="subtitle">Chào cậu nhaa! 🌷<br>Ghé thăm những góc nhỏ của Khôi ở bên dưới nhé.</p>
 <div class="pills"><span class="pill">🎮 Gaming</span><span class="pill">🌸 Anime</span><span class="pill">✨ My world</span></div>
</header>
<section class="content">
 <div class="head"><h2>♡ Chọn một cánh cửa nè</h2><small id="count">links</small></div>
 <section class="links" id="links"></section>
 <p class="note">૮ ˶ᵔ ᵕ ᵔ˶ ა &nbsp; Cảm ơn cậu đã ghé qua!</p>
</section>
<footer class="footer">Made with <span class="heart">♥</span> by <strong>Lâm Gia Khôi</strong><br>một chiếc góc nhỏ xinh xinh ✿</footer>
</div>
</main>
<script>
/* Sửa URL thật của bạn ở đây. Xóa mục không dùng hoặc thêm mục mới.
   Ví dụ: {name:"Instagram", note:"Ảnh và story", icon:"📷", url:"https://instagram.com/tenban"} */
const links = [
 {name:"YouTube", note:"Video và những điều mình thích", icon:"▶️", url:"https://youtube.com/"},
 {name:"TikTok", note:"Một chút video vui vui", icon:"🎵", url:"https://tiktok.com/"},
 {name:"Facebook", note:"Kết nối với mình nè", icon:"💌", url:"https://facebook.com/"},
 {name:"Discord", note:"Gặp nhau ở server", icon:"🫧", url:"https://discord.com/"},
 {name:"Steam", note:"Game cùng bạn bè", icon:"🎮", url:"https://store.steampowered.com/"},
 {name:"TradingView", note:"Biểu đồ và góc trading", icon:"📈", url:"https://tradingview.com/"},
 {name:"Website cá nhân", note:"Blog, dự án, tài liệu", icon:"🌐", url:""},
 {name:"Liên hệ", note:"Gửi lời nhắn cho mình", icon:"✉️", url:""}
];
const root=document.getElementById("links");
links.forEach(item=>{
 if(!item.url.trim()) return;
 const a=document.createElement("a");a.className="link";a.href=item.url;a.target="_blank";a.rel="noopener noreferrer";
 const ico=document.createElement("span");ico.className="icon";ico.textContent=item.icon;
 const txt=document.createElement("span");txt.className="txt";
 const strong=document.createElement("strong");strong.textContent=item.name;
 const small=document.createElement("small");small.textContent=item.note;
 txt.append(strong,small);
 const go=document.createElement("span");go.className="go";go.textContent="♡";
 a.append(ico,txt,go);root.append(a);
});
document.getElementById("count").textContent=root.children.length+" liên kết";
</script>
</body>
</html>
